[platformio]
workspace_dir = .pio

[devkit_settings]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32-libs @ https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.2.0-h.zip
  platformio/tool-esptoolpy @ 2.41100.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.partitions = partitions_devkit_32mb.csv
board_build.arduino.memory_type = opi_opi
build_unflags = -Os
build_flags =
  -O3
  -ffile-prefix-map=${PROJECT_DIR}=.
  -fmacro-prefix-map=${PROJECT_DIR}=.
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 460800

[env:local_devkit]
extends = devkit_settings
build_src_filter =
  -<*>
  +<main.cpp>

[env:local_devkit_int8]
extends = env:local_devkit
build_flags =
  ${devkit_settings.build_flags}
  -DPOCKETGPT_INT8_HEAD=1
build_src_filter =
  -<*>
  +<main.cpp>
  +<int8_head_s3.S>
